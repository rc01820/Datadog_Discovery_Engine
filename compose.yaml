name: datadog-search

x-api-env: &api-env
  DATABASE_URL: postgresql://search:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/search
  REDIS_URL: redis://redis:6379/0
  SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
  DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?Set DATA_ENCRYPTION_KEY in .env}
  ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  DEMO_DATA: ${DEMO_DATA:-true}
  DATADOG_SITE: ${DATADOG_SITE:-datadoghq.com}
  DATADOG_ORG: ${DATADOG_ORG:-default}
  DATADOG_API_KEY: ${DATADOG_API_KEY:-}
  DATADOG_APP_KEY: ${DATADOG_APP_KEY:-}
  # Optional Tag Enforcer integration: imports tag-policy verdicts.
  TAG_ENFORCER_URL: ${TAG_ENFORCER_URL:-}
  TAG_ENFORCER_TOKEN: ${TAG_ENFORCER_TOKEN:-}
  TAG_ENFORCER_PUBLIC_URL: ${TAG_ENFORCER_PUBLIC_URL:-}

services:
  web:
    container_name: datadog-search-web
    build: ./web
    image: datadog-search-web:1.5.0
    ports:
      - "${HTTP_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/nginx-health"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 128M }

  api:
    container_name: datadog-search-api
    build: ./api
    image: datadog-search-api:1.5.0
    environment: *api-env
    volumes:
      - ${HISTORY_ARCHIVE_PATH:-history_archive}:/archive
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }

  worker:
    container_name: datadog-search-worker
    build: ./api                    # same image as api (built once, cached); avoids a registry pull attempt
    image: datadog-search-api:1.5.0
    command: ["python", "-m", "app.worker"]
    environment: *api-env
    volumes:
      - ${HISTORY_ARCHIVE_PATH:-history_archive}:/archive
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      disable: true
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }

  db:
    container_name: datadog-search-db
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: search
      POSTGRES_USER: search
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U search -d search"]
      interval: 5s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }

  redis:
    container_name: datadog-search-redis
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "volatile-lru"]
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 192M }

volumes:
  db_data:
  redis_data:
  history_archive:
